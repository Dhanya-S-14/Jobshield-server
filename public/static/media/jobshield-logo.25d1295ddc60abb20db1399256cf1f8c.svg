<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="256" cy="256" r="230" fill="url(#glowGrad)"/>

  <!-- Main Shield Shape -->
  <path d="M256 60 L420 140 L420 270 C420 360 350 430 256 460 C162 430 92 360 92 270 L92 140 Z"
        fill="url(#shieldGrad)" opacity="0.12"/>
  <path d="M256 60 L420 140 L420 270 C420 360 350 430 256 460 C162 430 92 360 92 270 L92 140 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Shield inner border -->
  <path d="M256 82 L396 152 L396 265 C396 345 336 408 256 434 C176 408 116 345 116 265 L116 152 Z"
        fill="none" stroke="url(#shieldGrad)" stroke-width="2" opacity="0.3"/>

  <!-- AI Circuit Lines - Left side -->
  <g stroke="#06B6D4" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M160 200 L160 230 L195 230"/>
    <circle cx="200" cy="230" r="5" fill="#06B6D4"/>
    <path d="M200 230 L220 230"/>
    <circle cx="225" cy="230" r="3" fill="#06B6D4"/>

    <path d="M170 260 L170 285 L195 285"/>
    <circle cx="200" cy="285" r="5" fill="#06B6D4"/>
    <path d="M200 285 L215 285"/>
    <circle cx="220" cy="285" r="3" fill="#06B6D4"/>

    <path d="M165 340 L165 315 L195 315"/>
    <circle cx="200" cy="315" r="5" fill="#06B6D4"/>
    <path d="M200 315 L210 315"/>
  </g>

  <!-- AI Circuit Lines - Right side -->
  <g stroke="#2563EB" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M352 210 L352 240 L325 240"/>
    <circle cx="320" cy="240" r="4" fill="#2563EB"/>
    <path d="M315 240 L300 240"/>
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(256,280)">
    <!-- Handle -->
    <rect x="-6" y="40" width="12" height="55" rx="6" fill="url(#shieldGrad)" transform="rotate(-45)"/>
    <rect x="-4" y="40" width="8" height="55" rx="4" fill="rgba(255,255,255,0.15)" transform="rotate(-45)"/>
    <!-- Lens ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#shieldGrad)" stroke-width="7"/>
    <circle cx="0" cy="0" r="57" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Lens inner -->
    <circle cx="0" cy="0" r="53" fill="rgba(6,182,212,0.06)"/>
  </g>

  <!-- Briefcase hint - top of shield -->
  <g transform="translate(256,155)">
    <rect x="-50" y="-8" width="100" height="18" rx="4" fill="none" stroke="url(#innerGlow)" stroke-width="3" opacity="0.6"/>
    <rect x="-35" y="-24" width="70" height="18" rx="4" fill="none" stroke="url(#innerGlow)" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Checkmark -->
  <g transform="translate(222,264)">
    <path d="M0 30 L18 48 L50 12"
          fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Checkmark glow -->
    <path d="M0 30 L18 48 L50 12"
          fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
  </g>

  <!-- Shield top highlight -->
  <path d="M180 118 L256 78 L332 118"
        fill="none" stroke="url(#innerGlow)" stroke-width="3" opacity="0.5" stroke-linecap="round"/>

  <!-- Neural dots -->
  <g fill="#06B6D4" opacity="0.8">
    <circle cx="256" cy="190" r="4"/>
    <circle cx="256" cy="215" r="3"/>
    <circle cx="240" cy="205" r="2.5"/>
    <circle cx="272" cy="205" r="2.5"/>
  </g>

  <!-- Connecting neural lines -->
  <g stroke="#06B6D4" stroke-width="1" opacity="0.4" fill="none">
    <path d="M256 190 L256 215"/>
    <path d="M256 190 L240 205"/>
    <path d="M256 190 L272 205"/>
    <path d="M240 205 L256 215"/>
    <path d="M272 205 L256 215"/>
  </g>
</svg>

name: Keep Render Awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -s -o /dev/null -w "health %{http_code} in %{time_total}s\n" https://jobshield-server.onrender.com/health